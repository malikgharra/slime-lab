<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Slime Mold Lab</title>
<meta name="description" content="A million-agent Physarum slime mold simulation running entirely on your GPU with WebGL2.">
<style>
:root{--bg:#05070a;--panel:rgba(12,16,22,.84);--fg:#dbe4ec;--mute:#7f8d99;--acc:#5ef2c6;--line:rgba(255,255,255,.09)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:13px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
canvas{position:fixed;inset:0;width:100vw;height:100vh;display:block;touch-action:none;cursor:crosshair}
#panel{position:fixed;top:12px;right:12px;width:280px;max-height:calc(100vh - 24px);overflow:auto;background:var(--panel);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:14px;padding:14px 14px 12px;transition:opacity .3s,transform .3s}
#panel.hidden{opacity:0;pointer-events:none;transform:translateX(24px)}
h1{font-size:15px;margin:0;letter-spacing:.02em}
.sub{color:var(--mute);font-size:12px;margin:2px 0 8px}
.sec{border-top:1px solid var(--line);padding-top:8px;margin-top:10px}
.sec-t{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--mute);margin-bottom:4px}
.lbl{display:flex;justify-content:space-between;color:var(--mute);font-size:12px;margin:7px 0 1px}
.lbl b{color:var(--fg);font-weight:500;font-variant-numeric:tabular-nums}
input[type=range]{width:100%;margin:2px 0;accent-color:var(--acc)}
.row{display:flex;flex-wrap:wrap;gap:6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.grid2 label{font-size:11px;color:var(--mute);display:flex;flex-direction:column;gap:2px}
button,select{background:rgba(255,255,255,.06);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:6px 9px;font:inherit;cursor:pointer}
button:hover,select:hover{background:rgba(255,255,255,.12)}
button.on{border-color:var(--acc);color:var(--acc)}
button.rec{border-color:#ff5a6a;color:#ff5a6a}
select{width:100%}
select option{background:#11161d}
#stats{position:fixed;left:12px;top:12px;color:var(--mute);font:12px ui-monospace,"Cascadia Mono",Consolas,monospace;background:rgba(0,0,0,.35);padding:5px 8px;border-radius:8px;pointer-events:none}
#hint{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:rgba(0,0,0,.55);padding:9px 14px;border-radius:999px;font-size:13px;white-space:nowrap;pointer-events:none;transition:opacity 1.2s}
#hint.gone{opacity:0}
#err{position:fixed;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:24px;font-size:15px}
kbd{font:11px ui-monospace,monospace;border:1px solid var(--line);border-radius:4px;padding:0 4px;color:var(--fg)}
@media (max-width:640px){
  #panel{width:auto;left:12px;right:12px;top:auto;bottom:12px;max-height:44vh}
  #hint{white-space:normal;width:calc(100% - 32px);text-align:center;bottom:auto;top:48px;border-radius:12px}
}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="stats">starting…</div>
<div id="hint">Drag to feed · Right‑drag or Shift‑drag to scatter · <kbd>Space</kbd> pause · <kbd>R</kbd> reset · <kbd>H</kbd> hide panel · <kbd>1</kbd>–<kbd>5</kbd> presets</div>
<div id="err"></div>

<div id="panel">
  <h1>Slime Mold Lab</h1>
  <div class="sub">Physarum agents, simulated on your GPU</div>

  <div class="sec">
    <div class="sec-t">Presets</div>
    <div class="row" id="presets"></div>
  </div>

  <div class="sec">
    <div class="sec-t">Behaviour</div>
    <div id="sliders"></div>
  </div>

  <div class="sec">
    <div class="sec-t">Colony</div>
    <div class="grid2">
      <label>Species<select id="species"><option value="1">1</option><option value="2">2</option><option value="3">3</option></select></label>
      <label>Agents<select id="agents"><option value="512">262K</option><option value="1024">1.05M</option><option value="2048">4.19M</option></select></label>
      <label>Start shape<select id="pattern"><option value="disk">Disk, inward</option><option value="bang">Big bang</option><option value="ring">Spinning ring</option><option value="random">Random</option></select></label>
      <label>Palette<select id="palette"></select></label>
    </div>
  </div>

  <div class="sec">
    <div class="row">
      <button id="reset">Reset <kbd>R</kbd></button>
      <button id="pause">Pause</button>
      <button id="tool" title="Tool for touch and left mouse">Tool: Feed</button>
      <button id="shot">Screenshot</button>
      <button id="record">Record</button>
    </div>
  </div>
</div>

<script>
'use strict';
const $ = s => document.querySelector(s);
const canvas = $('#c');

function fail(msg) {
  const e = $('#err');
  e.style.display = 'flex';
  e.textContent = msg;
  $('#panel').style.display = 'none';
  $('#hint').style.display = 'none';
  $('#stats').style.display = 'none';
  throw new Error(msg);
}

const gl = canvas.getContext('webgl2', { antialias: false, alpha: false, depth: false, stencil: false, powerPreference: 'high-performance' });
if (!gl) fail('This needs WebGL2. Try a recent Chrome, Edge, Firefox or Safari.');
if (!gl.getExtension('EXT_color_buffer_float')) fail('Your GPU/browser does not support rendering to float textures (EXT_color_buffer_float).');

// ---------- shaders ----------
const HEAD = `#version 300 es
precision highp float; precision highp int; precision highp sampler2D;
`;

const VS_FULL = HEAD + `
const vec2 P[3] = vec2[3](vec2(-1.0,-1.0), vec2(3.0,-1.0), vec2(-1.0,3.0));
void main(){ gl_Position = vec4(P[gl_VertexID], 0.0, 1.0); }`;

// Move each agent: sense the trail at three points ahead, turn toward the strongest, step forward.
const FS_UPDATE = HEAD + `
uniform sampler2D uAgents;
uniform sampler2D uTrail;
uniform vec2 uRes;
uniform float uSA, uSD, uRA, uSpeed, uInter;
uniform uint uFrame;
uniform vec4 uMouse; // xy = position, z = mode (1 feed, -1 scatter), w = radius
out vec4 o;

uint hash(uint x){ x ^= x >> 16; x *= 0x7feb352du; x ^= x >> 15; x *= 0x846ca68bu; x ^= x >> 16; return x; }
float rnd(uvec2 c, uint s){ return float(hash(c.x ^ hash(c.y ^ hash(s)))) * (1.0/4294967296.0); }

vec3 W;
float sense(vec2 p, float a){
  vec2 q = p + vec2(cos(a), sin(a)) * uSD;
  return dot(texture(uTrail, q / uRes).rgb, W);
}

void main(){
  ivec2 ic = ivec2(gl_FragCoord.xy);
  vec4 a = texelFetch(uAgents, ic, 0);
  vec2 p = a.xy;
  float ang = a.z;
  int s = int(a.w + 0.5);
  vec3 m = vec3(float(s == 0), float(s == 1), float(s == 2));
  W = m - (1.0 - m) * uInter;   // follow own species, avoid the others

  float F = sense(p, ang), L = sense(p, ang + uSA), R = sense(p, ang - uSA);
  float r = rnd(uvec2(ic), uFrame);
  if (F >= L && F >= R) {
    // keep going
  } else if (F < L && F < R) {
    ang += (r < 0.5 ? 1.0 : -1.0) * uRA;
  } else if (L > R) {
    ang += uRA;
  } else {
    ang -= uRA;
  }
  ang += (rnd(uvec2(ic.yx), uFrame + 7u) - 0.5) * 0.08;

  if (uMouse.z < 0.0) {
    vec2 d = p - uMouse.xy;
    float dl = length(d);
    if (dl < uMouse.w && dl > 0.001) ang = atan(d.y, d.x) + (r - 0.5) * 0.6;
  }

  p += vec2(cos(ang), sin(ang)) * uSpeed;
  p = mod(p, uRes);
  o = vec4(p, mod(ang, 6.2831853), a.w);
}`;

// Each agent drops one point of "chemical" into its species' channel.
const VS_DEPOSIT = HEAD + `
uniform sampler2D uAgents;
uniform int uW;
uniform vec2 uRes;
flat out vec3 vC;
void main(){
  ivec2 c = ivec2(gl_VertexID % uW, gl_VertexID / uW);
  vec4 a = texelFetch(uAgents, c, 0);
  gl_Position = vec4((floor(a.xy) + 0.5) / uRes * 2.0 - 1.0, 0.0, 1.0);
  gl_PointSize = 1.0;
  int s = int(a.w + 0.5);
  vC = vec3(float(s == 0), float(s == 1), float(s == 2));
}`;
const FS_DEPOSIT = HEAD + `
flat in vec3 vC;
out vec4 o;
void main(){ o = vec4(vC, 1.0); }`;

// Blur and evaporate the trail; the mouse adds food or wipes it.
const FS_DIFFUSE = HEAD + `
uniform sampler2D uTrail;
uniform vec2 uRes;
uniform float uDecay, uDiff, uFood;
uniform vec3 uFoodMask;
uniform vec4 uMouse;
out vec4 o;
void main(){
  vec2 f = gl_FragCoord.xy;
  vec3 c = texture(uTrail, f / uRes).rgb;
  vec3 s = vec3(0.0);
  for (int y = -1; y <= 1; y++)
    for (int x = -1; x <= 1; x++)
      s += texture(uTrail, (f + vec2(x, y)) / uRes).rgb;
  vec3 v = mix(c, s / 9.0, uDiff) * uDecay;
  if (uMouse.z != 0.0) {
    float d = length(f - uMouse.xy);
    float k = exp(-d * d / (uMouse.w * uMouse.w * 0.25));
    if (uMouse.z > 0.0) v += uFood * k * uFoodMask;
    else v *= 1.0 - k;
  }
  o = vec4(min(v, vec3(60000.0)), 1.0);
}`;

const FS_DISPLAY = HEAD + `
uniform sampler2D uTrail;
uniform vec2 uRes;
uniform vec3 uGain;
uniform vec3 uBg, uC0, uC1, uC2;
out vec4 o;
void main(){
  vec2 uv = gl_FragCoord.xy / uRes;
  vec3 t = 1.0 - exp(-texture(uTrail, uv).rgb * uGain);
  vec3 col = uBg + uC0 * t.r + uC1 * t.g + uC2 * t.b;
  float hi = max(t.r, max(t.g, t.b));
  col += vec3(pow(hi, 5.0) * 0.45);
  vec2 q = uv - 0.5;
  col *= 1.0 - dot(q, q) * 0.7;
  o = vec4(clamp(col, 0.0, 1.0), 1.0);
}`;

function compile(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) fail('Shader error: ' + gl.getShaderInfoLog(s));
  return s;
}
function program(vs, fs) {
  const p = gl.createProgram();
  gl.attachShader(p, compile(gl.VERTEX_SHADER, vs));
  gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) fail('Link error: ' + gl.getProgramInfoLog(p));
  const u = {};
  const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
  for (let i = 0; i < n; i++) {
    const name = gl.getActiveUniform(p, i).name;
    u[name] = gl.getUniformLocation(p, name);
  }
  return { p, u: new Proxy(u, { get: (t, k) => t[k] ?? null }) };
}

const P_UPDATE = program(VS_FULL, FS_UPDATE);
const P_DEPOSIT = program(VS_DEPOSIT, FS_DEPOSIT);
const P_DIFFUSE = program(VS_FULL, FS_DIFFUSE);
const P_DISPLAY = program(VS_FULL, FS_DISPLAY);
gl.bindVertexArray(gl.createVertexArray());

// ---------- state ----------
const PARAMS = [
  { k: 'sa', label: 'Sensor angle', min: 5, max: 90, step: 0.5, fmt: v => v.toFixed(1) + '°' },
  { k: 'sd', label: 'Sensor distance', min: 1, max: 60, step: 0.5, fmt: v => v.toFixed(1) + ' px' },
  { k: 'ra', label: 'Turn angle', min: 2, max: 90, step: 0.5, fmt: v => v.toFixed(1) + '°' },
  { k: 'speed', label: 'Speed', min: 0.2, max: 4, step: 0.05, fmt: v => v.toFixed(2) },
  { k: 'decay', label: 'Trail persistence', min: 0.8, max: 0.995, step: 0.005, fmt: v => v.toFixed(3) },
  { k: 'diff', label: 'Diffusion', min: 0, max: 1, step: 0.01, fmt: v => v.toFixed(2) },
  { k: 'inter', label: 'Rivalry between species', min: 0, max: 1.5, step: 0.01, fmt: v => v.toFixed(2) },
  { k: 'exposure', label: 'Brightness', min: 0.1, max: 4, step: 0.05, fmt: v => v.toFixed(2) },
  { k: 'steps', label: 'Steps per frame', min: 1, max: 6, step: 1, fmt: v => String(v) },
];

const PRESETS = [
  { name: 'Veins', sa: 22.5, sd: 9, ra: 45, speed: 1, decay: 0.95, diff: 0.6, inter: 0.8, species: 1, pattern: 'disk', palette: 'Abyss' },
  { name: 'Turf war', sa: 30, sd: 14, ra: 30, speed: 1.3, decay: 0.93, diff: 0.5, inter: 1.0, species: 3, pattern: 'disk', palette: 'Abyss' },
  { name: 'Labyrinth', sa: 45, sd: 22, ra: 20, speed: 1.5, decay: 0.92, diff: 0.4, inter: 0.8, species: 1, pattern: 'random', palette: 'Ice' },
  { name: 'Cells', sa: 70, sd: 4, ra: 50, speed: 1, decay: 0.9, diff: 0.8, inter: 1.2, species: 2, pattern: 'random', palette: 'Ember' },
  { name: 'Currents', sa: 15, sd: 30, ra: 10, speed: 2, decay: 0.97, diff: 0.3, inter: 0.5, species: 2, pattern: 'ring', palette: 'Ice' },
];

const PALETTES = {
  Abyss: { bg: '#03060b', c: ['#2ef2c4', '#ff4fa3', '#ffc44d'] },
  Ember: { bg: '#090403', c: ['#ff7a2e', '#ffd166', '#e63946'] },
  Ice:   { bg: '#02040a', c: ['#6fb2ff', '#c39bff', '#5ef2f2'] },
  Moss:  { bg: '#040703', c: ['#b6f25e', '#f2e65e', '#5ef29a'] },
  Mono:  { bg: '#000000', c: ['#f2f2f2', '#9aa0a6', '#c8c8c8'] },
};

const params = { sa: 22.5, sd: 9, ra: 45, speed: 1, decay: 0.95, diff: 0.6, inter: 0.8, exposure: 1, steps: 2 };
const settings = { species: 1, agents: 1024, pattern: 'disk', palette: 'Abyss' };
const mouse = { x: 0, y: 0, mode: 0, radius: 40 };
let tool = 1; // 1 feed, -1 scatter
let paused = false, frame = 0, shotPending = false;

let W = 0, H = 0, AW = 0, N = 0;
let agents = [], agentFbo = [], trail = [], trailFbo = [], ca = 0, ct = 0;

const maxTex = gl.getParameter(gl.MAX_TEXTURE_SIZE);
for (const o of $('#agents').options) if (+o.value > maxTex) o.disabled = true;

// ---------- GPU resources ----------
function makeTex(w, h, ifmt, type, filter, wrap, data = null) {
  const t = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texImage2D(gl.TEXTURE_2D, 0, ifmt, w, h, 0, gl.RGBA, type, data);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, filter);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, filter);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, wrap);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, wrap);
  return t;
}
function makeFbo(t) {
  const f = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, f);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, t, 0);
  if (gl.checkFramebufferStatus(gl.FRAMEBUFFER) !== gl.FRAMEBUFFER_COMPLETE) fail('Could not create a float framebuffer on this GPU.');
  return f;
}
function free() {
  agents.forEach(t => gl.deleteTexture(t)); trail.forEach(t => gl.deleteTexture(t));
  agentFbo.forEach(f => gl.deleteFramebuffer(f)); trailFbo.forEach(f => gl.deleteFramebuffer(f));
}

function seedAgents() {
  const n = AW * AW, S = settings.species, d = new Float32Array(n * 4);
  const cx = W / 2, cy = H / 2, R = Math.min(W, H) * 0.42, TAU = Math.PI * 2;
  for (let i = 0; i < n; i++) {
    let x, y, a, s;
    const th = Math.random() * TAU;
    const sector = Math.min(S - 1, Math.floor(th / TAU * S));
    switch (settings.pattern) {
      case 'bang': {
        const r = Math.random() * 6;
        x = cx + r * Math.cos(th); y = cy + r * Math.sin(th); a = th; s = sector; break;
      }
      case 'ring': {
        const r = R * (0.85 + 0.15 * Math.random());
        x = cx + r * Math.cos(th); y = cy + r * Math.sin(th); a = th + Math.PI / 2; s = sector; break;
      }
      case 'random':
        x = Math.random() * W; y = Math.random() * H; a = Math.random() * TAU; s = Math.floor(Math.random() * S); break;
      default: {
        const r = R * Math.sqrt(Math.random());
        x = cx + r * Math.cos(th); y = cy + r * Math.sin(th); a = th + Math.PI + (Math.random() - 0.5) * 0.4; s = sector;
      }
    }
    d[i * 4] = (x % W + W) % W; d[i * 4 + 1] = (y % H + H) % H; d[i * 4 + 2] = (a % TAU + TAU) % TAU; d[i * 4 + 3] = s;
  }
  gl.bindTexture(gl.TEXTURE_2D, agents[ca]);
  gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, AW, AW, gl.RGBA, gl.FLOAT, d);
  gl.clearColor(0, 0, 0, 0);
  for (const f of trailFbo) { gl.bindFramebuffer(gl.FRAMEBUFFER, f); gl.clear(gl.COLOR_BUFFER_BIT); }
  frame = 0;
}

function rebuild() {
  free();
  W = Math.max(64, Math.floor(innerWidth));
  H = Math.max(64, Math.floor(innerHeight));
  canvas.width = W; canvas.height = H;
  AW = settings.agents; N = AW * AW;
  agents = [0, 1].map(() => makeTex(AW, AW, gl.RGBA32F, gl.FLOAT, gl.NEAREST, gl.CLAMP_TO_EDGE));
  agentFbo = agents.map(makeFbo);
  trail = [0, 1].map(() => makeTex(W, H, gl.RGBA16F, gl.HALF_FLOAT, gl.LINEAR, gl.REPEAT));
  trailFbo = trail.map(makeFbo);
  ca = 0; ct = 0;
  seedAgents();
}

// ---------- simulation ----------
const DEG = Math.PI / 180;
function avgTrail() { // mean trail value per channel at steady state, used to normalise brightness and food
  return (N / settings.species) / (W * H) / (1 - params.decay);
}

function step() {
  const m = [mouse.x, mouse.y, mouse.mode, mouse.radius];

  gl.bindFramebuffer(gl.FRAMEBUFFER, agentFbo[1 - ca]);
  gl.viewport(0, 0, AW, AW);
  gl.useProgram(P_UPDATE.p);
  let u = P_UPDATE.u;
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, agents[ca]);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, trail[ct]);
  gl.uniform1i(u.uAgents, 0); gl.uniform1i(u.uTrail, 1);
  gl.uniform2f(u.uRes, W, H);
  gl.uniform1f(u.uSA, params.sa * DEG); gl.uniform1f(u.uSD, params.sd);
  gl.uniform1f(u.uRA, params.ra * DEG); gl.uniform1f(u.uSpeed, params.speed);
  gl.uniform1f(u.uInter, settings.species > 1 ? params.inter : 0);
  gl.uniform1ui(u.uFrame, frame >>> 0);
  gl.uniform4fv(u.uMouse, m);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  ca = 1 - ca;

  gl.bindFramebuffer(gl.FRAMEBUFFER, trailFbo[ct]);
  gl.viewport(0, 0, W, H);
  gl.useProgram(P_DEPOSIT.p);
  u = P_DEPOSIT.u;
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, agents[ca]);
  gl.uniform1i(u.uAgents, 0); gl.uniform1i(u.uW, AW); gl.uniform2f(u.uRes, W, H);
  gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE);
  gl.drawArrays(gl.POINTS, 0, N);
  gl.disable(gl.BLEND);

  gl.bindFramebuffer(gl.FRAMEBUFFER, trailFbo[1 - ct]);
  gl.useProgram(P_DIFFUSE.p);
  u = P_DIFFUSE.u;
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, trail[ct]);
  gl.uniform1i(u.uTrail, 0); gl.uniform2f(u.uRes, W, H);
  gl.uniform1f(u.uDecay, params.decay); gl.uniform1f(u.uDiff, params.diff);
  gl.uniform1f(u.uFood, avgTrail() * 1.5);
  const S = settings.species;
  gl.uniform3f(u.uFoodMask, 1, S > 1 ? 1 : 0, S > 2 ? 1 : 0);
  gl.uniform4fv(u.uMouse, m);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  ct = 1 - ct;

  frame++;
}

function hex(h) { const n = parseInt(h.slice(1), 16); return [(n >> 16 & 255) / 255, (n >> 8 & 255) / 255, (n & 255) / 255]; }

function display() {
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0, 0, W, H);
  gl.useProgram(P_DISPLAY.p);
  const u = P_DISPLAY.u, pal = PALETTES[settings.palette], S = settings.species;
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, trail[ct]);
  gl.uniform1i(u.uTrail, 0); gl.uniform2f(u.uRes, W, H);
  const g = params.exposure * 0.25 / avgTrail();
  gl.uniform3f(u.uGain, g, g, g);
  gl.uniform3fv(u.uBg, hex(pal.bg));
  gl.uniform3fv(u.uC0, hex(pal.c[0]));
  gl.uniform3fv(u.uC1, S > 1 ? hex(pal.c[1]) : [0, 0, 0]);
  gl.uniform3fv(u.uC2, S > 2 ? hex(pal.c[2]) : [0, 0, 0]);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}

// ---------- UI ----------
const sliderEls = {};
for (const p of PARAMS) {
  const wrap = document.createElement('div');
  wrap.innerHTML = `<div class="lbl"><span>${p.label}</span><b></b></div><input type="range" min="${p.min}" max="${p.max}" step="${p.step}">`;
  const input = wrap.querySelector('input'), out = wrap.querySelector('b');
  input.addEventListener('input', () => { params[p.k] = +input.value; out.textContent = p.fmt(params[p.k]); markPreset(-1); });
  sliderEls[p.k] = { input, out, p };
  $('#sliders').appendChild(wrap);
}
function syncSliders() {
  for (const k in sliderEls) { const e = sliderEls[k]; e.input.value = params[k]; e.out.textContent = e.p.fmt(params[k]); }
}

for (const name in PALETTES) $('#palette').add(new Option(name, name));
function syncSelects() { for (const k of ['species', 'agents', 'pattern', 'palette']) $('#' + k).value = settings[k]; }

const presetBtns = PRESETS.map((pr, i) => {
  const b = document.createElement('button');
  b.textContent = pr.name;
  b.title = 'Key ' + (i + 1);
  b.onclick = () => applyPreset(i);
  $('#presets').appendChild(b);
  return b;
});
const rnd = document.createElement('button');
rnd.textContent = 'Surprise me';
rnd.onclick = randomize;
$('#presets').appendChild(rnd);

function markPreset(i) { presetBtns.forEach((b, j) => b.classList.toggle('on', j === i)); }

function applyPreset(i) {
  const pr = PRESETS[i];
  for (const k of ['sa', 'sd', 'ra', 'speed', 'decay', 'diff', 'inter']) params[k] = pr[k];
  settings.species = pr.species; settings.pattern = pr.pattern; settings.palette = pr.palette;
  syncSliders(); syncSelects(); markPreset(i);
  seedAgents();
}

function randomize() {
  const r = (a, b) => a + Math.random() * (b - a);
  params.sa = +r(10, 80).toFixed(1); params.sd = +r(3, 40).toFixed(1); params.ra = +r(8, 70).toFixed(1);
  params.speed = +r(0.6, 2.5).toFixed(2); params.decay = +r(0.88, 0.98).toFixed(3); params.diff = +r(0.2, 0.9).toFixed(2);
  params.inter = +r(0.3, 1.3).toFixed(2);
  settings.species = 1 + Math.floor(Math.random() * 3);
  settings.pattern = ['disk', 'bang', 'ring', 'random'][Math.floor(Math.random() * 4)];
  const pals = Object.keys(PALETTES);
  settings.palette = pals[Math.floor(Math.random() * pals.length)];
  syncSliders(); syncSelects(); markPreset(-1);
  seedAgents();
}

$('#species').onchange = e => { settings.species = +e.target.value; seedAgents(); };
$('#pattern').onchange = e => { settings.pattern = e.target.value; seedAgents(); };
$('#palette').onchange = e => { settings.palette = e.target.value; };
$('#agents').onchange = e => { settings.agents = +e.target.value; rebuild(); };
$('#reset').onclick = () => seedAgents();
$('#pause').onclick = togglePause;
$('#tool').onclick = () => { tool = -tool; $('#tool').textContent = 'Tool: ' + (tool > 0 ? 'Feed' : 'Scatter'); };
$('#shot').onclick = () => { shotPending = true; };
$('#record').onclick = toggleRecord;

function togglePause() { paused = !paused; $('#pause').textContent = paused ? 'Play' : 'Pause'; $('#pause').classList.toggle('on', paused); }

function download(blob, name) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}

let recorder = null;
function toggleRecord() {
  const btn = $('#record');
  if (recorder) { recorder.stop(); return; }
  if (!window.MediaRecorder || !canvas.captureStream) { btn.textContent = 'Not supported'; return; }
  const mime = ['video/webm;codecs=vp9', 'video/webm', 'video/mp4'].find(t => MediaRecorder.isTypeSupported(t));
  const chunks = [];
  recorder = new MediaRecorder(canvas.captureStream(60), mime ? { mimeType: mime, videoBitsPerSecond: 16e6 } : {});
  recorder.ondataavailable = e => e.data.size && chunks.push(e.data);
  recorder.onstop = () => {
    const type = recorder.mimeType || 'video/webm';
    download(new Blob(chunks, { type }), 'slime-mold.' + (type.includes('mp4') ? 'mp4' : 'webm'));
    recorder = null; btn.textContent = 'Record'; btn.classList.remove('rec');
  };
  recorder.start();
  btn.textContent = '● Stop'; btn.classList.add('rec');
}

// pointer
function toSim(e) { mouse.x = e.clientX / innerWidth * W; mouse.y = (1 - e.clientY / innerHeight) * H; }
canvas.addEventListener('contextmenu', e => e.preventDefault());
canvas.addEventListener('pointerdown', e => {
  canvas.setPointerCapture(e.pointerId);
  toSim(e);
  mouse.mode = (e.button === 2 || e.shiftKey) ? -1 : tool;
  hideHint();
});
canvas.addEventListener('pointermove', e => { if (mouse.mode) toSim(e); });
const up = () => { mouse.mode = 0; };
canvas.addEventListener('pointerup', up);
canvas.addEventListener('pointercancel', up);

addEventListener('keydown', e => {
  if (e.target.tagName === 'SELECT') return;
  if (e.code === 'Space') { e.preventDefault(); togglePause(); }
  else if (e.key === 'r' || e.key === 'R') seedAgents();
  else if (e.key === 'h' || e.key === 'H') $('#panel').classList.toggle('hidden');
  else if (e.key >= '1' && e.key <= String(PRESETS.length)) applyPreset(+e.key - 1);
  else if (e.key === '0') randomize();
});

let hintTimer = setTimeout(hideHint, 9000);
function hideHint() { clearTimeout(hintTimer); $('#hint').classList.add('gone'); }

let resizeTimer;
addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(rebuild, 250); });

// ---------- loop ----------
let last = performance.now(), fps = 60, statTick = 0;
function loop(now) {
  const dt = now - last; last = now;
  fps += ((1000 / Math.max(dt, 1)) - fps) * 0.05;
  if (!paused) for (let i = 0; i < params.steps; i++) step();
  display();
  if (shotPending) { shotPending = false; canvas.toBlob(b => b && download(b, 'slime-mold.png')); }
  if (++statTick % 15 === 0) $('#stats').textContent = `${N.toLocaleString()} agents · ${fps.toFixed(0)} fps · ${W}×${H}${paused ? ' · paused' : ''}`;
  requestAnimationFrame(loop);
}

syncSliders(); syncSelects(); markPreset(0);
rebuild();
requestAnimationFrame(loop);
</script>
</body>
</html>
